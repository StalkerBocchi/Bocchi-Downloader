name: Build and Push to Docker Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:   # позволяет запускать вручную

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: true
          tags: yaroslavgrud/bocchi-downloader-server-edition:latest

      - name: Docker Scout security scan
        uses: docker/scout-action@e7e2a72bf1485d10a58f30696b6c513b261ce4fa
        with:
          command: cves
          image: yaroslavgrud/bocchi-downloader-server-edition:latest
          exit-code: false